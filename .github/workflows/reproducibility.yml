name: Reproducibility

on:
  push:
    branches:
      - main
      - feature/reproducible-workflows
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-workflow-lock.txt

      - name: Install locked workflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements-workflow-lock.txt

      - name: Run Python regression tests
        run: python -m pytest -q

  workflow-smoke-tests:
    name: Docker, Nextflow, and Snakemake parity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.0"

      - name: Set up Snakemake environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/snakemake/environment.yml
          environment-name: wnt-snakemake
          cache-environment: true
          init-shell: bash

      - name: Build locked analysis image
        run: |
          docker build \
            --file containers/Dockerfile \
            --tag wnt-rnaseq-analysis:workflow \
            .

      - name: Verify study data are excluded
        run: |
          docker run --rm \
            wnt-rnaseq-analysis:workflow \
            sh -c 'test ! -e data/processed'

      - name: Run portable tests in Docker
        run: |
          docker run --rm \
            wnt-rnaseq-analysis:workflow \
            python -m pytest -q \
            tests/workflow/test_wntpcp_funmap_pipeline.py

      - name: Run Nextflow smoke workflow
        run: |
          mkdir -p results/nextflow_metadata
          nextflow run main.nf \
            -profile docker

      - name: Run Snakemake smoke workflow
        run: |
          micromamba run \
            --name wnt-snakemake \
            snakemake \
            --snakefile workflow/snakemake/Snakefile \
            --configfile workflow/snakemake/config.yaml \
            --cores 1 \
            --printshellcmds

      - name: Verify cross-engine audit-table parity
        run: |
          cmp \
            results/nextflow_smoke/wntpcp_funmap_network_edge_audit.csv \
            results/snakemake_smoke/wntpcp_funmap_network_edge_audit.csv

          cmp \
            results/nextflow_smoke/wntpcp_funmap_network_node_audit.csv \
            results/snakemake_smoke/wntpcp_funmap_network_node_audit.csv

      - name: Validate cross-engine provenance summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "candidate_edges": 3,
              "displayed_edges": 3,
              "represented_nodes": 3,
          }

          paths = [
              Path(
                  "results/nextflow_smoke/"
                  "wntpcp_funmap_network_run_provenance.json"
              ),
              Path(
                  "results/snakemake_smoke/"
                  "wntpcp_funmap_network_run_provenance.json"
              ),
          ]

          for path in paths:
              provenance = json.loads(path.read_text())
              assert provenance["outputs"] == expected
              assert provenance["orthology"]["unmapped_genes"] == []
              assert (
                  provenance["funmap"]["source_format"]
                  == "official_three_column_funmap"
              )
              print(f"PASS: {path}")

          print("PASS: Nextflow and Snakemake summaries agree")
          PY

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-smoke-test-evidence
          path: |
            results/nextflow_smoke/
            results/nextflow_metadata/
            results/snakemake_smoke/
          if-no-files-found: warn
          retention-days: 7
